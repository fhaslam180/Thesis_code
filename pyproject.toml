[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bor-risk-agent"
version = "0.1.0"
description = "Supply-chain risk analysis agent using LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tavily-python>=0.5",
    "pypdf>=4.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
viz = [
    "folium>=0.14",
    "networkx>=3.0",
    "matplotlib>=3.7",
]
ner = ["spacy>=3.7,<4"]
pdf = ["pdfplumber>=0.10"]
all = [
    "folium>=0.14",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pytest>=8.0",
    "spacy>=3.7,<4",
    "pdfplumber>=0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bor_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
