# Hazard types — display metadata only.
# Weights are 1/N_HAZARDS (equal) defined as code constant N_HAZARDS=6.
# Thresholds come from data/reference_set.json (supplier_exposure_thresholds,
# company_exposure_thresholds), not this file.
hazards:
  - name: earthquake
    label: "Seismic"
    unit: "g (PGA)"
  - name: flood
    label: "River Flood"
    unit: "m depth (100-yr RP)"
  - name: wildfire
    label: "Wildfire"
    unit: "approx. FWI Q95"
  - name: cyclone
    label: "Cyclone"
    unit: "km/h (V_100)"
  - name: heat_stress
    label: "Apparent Heat Stress"
    unit: "fraction days >= 32 deg C"
  - name: drought
    label: "Drought"
    unit: "fraction months SPEI-12 <= -1"
